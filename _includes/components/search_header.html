{% comment %}
  Override of the just-the-docs 0.12.0 include of the same name.

  Upstream puts the search label text in a `<span class="sr-only">` inside the
  <label>. That span was rendering visibly above the search box, so the title
  showed twice: once as the placeholder, once as stray white text. The span is
  dropped here and the accessible name moved to `aria-label` on the input, so
  screen readers still announce the field. The <label> is kept (icon-only) so
  clicking the magnifying glass still focuses the input.
{% endcomment %}
{% capture search_placeholder %}{% include search_placeholder_custom.html %}{% endcapture %}

<div class="search" role="search">
  <div class="search-input-wrap">
    <input type="text" id="search-input" class="search-input" tabindex="0" placeholder="{{ search_placeholder | strip_html | strip }}" aria-label="{{ search_placeholder | strip_html | strip }}" autocomplete="off">
    <label for="search-input" class="search-label">
      <svg viewBox="0 0 24 24" class="search-icon" aria-hidden="true"><use xlink:href="#svg-search"></use></svg>
    </label>
  </div>
  <div id="search-results" class="search-results"></div>
</div>
