title: The Modding Bungalo
description: The Modding Bungalo wiki for guides on their lists as well as other modding related content
theme: just-the-docs
color_scheme: bungalo-dark
logo: "/assets/themoddingbungalo-horizontal.svg"
favicon_ico: "/assets/themoddingbungalo-vertical.svg"
# Site's own base URL. Feeds canonical links, og:url and absolute_url --
# it is not a place for the Discord invite (that lives in aux_links below).
url: https://themoddingbungalo.com
baseurl: ""

aux_links:
  JOIN THE DISCORD: https://discord.gg/bungalo

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Copyright &copy; 2026 The Modding Bungalo"

sass:
  # just-the-docs still uses @import and the global color functions, which Dart
  # Sass deprecated in 1.80. Silence the noise until upstream migrates to @use.
  quiet_deps: true
  silence_deprecations:
    - import

collections:
  lists:
    permalink: "/:collection/:path/"
    output: true
  ngvo:
    permalink: "/:collection/:path/"
    output: true
  modding_guides:
    permalink: "/:collection/:path/"
    output: true

just_the_docs:
  # Define which collections are used in just-the-docs
  collections:
    lists:
      name: Lists
      nav_fold: false
    ngvo:
      name: NGVO
      nav_fold: true 
    modding_guides:
      name: Modding Guides
      nav_fold: true
